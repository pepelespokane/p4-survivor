name: Pick reminders

# Runs hourly through the back half of the week. send_reminders.py decides whether
# this is actually the hour to send: it fires once, 8 hours before the first
# kickoff of the pool week, and logs every send so a re-run cannot double-mail.

on:
  schedule:
    # Wednesday through Saturday, hourly. Covers every kickoff pattern in the
    # season, including Thursday night openers.
    - cron: '5 * * * 3,4,5,6'
    # Commissioner digests, hourly Thursday through Saturday. send_reminders.py
    # gates these to Thursday 4pm and Saturday 7am Pacific and logs each one, so
    # the extra runs are no-ops. Gating in Python instead of cron is deliberate:
    # a fixed UTC cron slides an hour when Pacific drops to standard time on
    # Nov 1 2026, in the middle of the season.
    - cron: '20 * * * 4,5,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the emails instead of sending them'
        type: boolean
        default: true
      test_week:
        description: 'Pretend it is reminder time for this pool week (1-13)'
        type: string
        default: ''
      only:
        description: 'Send to just this player id or email (not logged, real reminder still fires)'
        type: string
        default: ''
      mode:
        description: 'Leave blank for player reminders, or "digest" for the commissioner summary'
        type: string
        default: ''

concurrency:
  group: pick-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send reminders if the window is open
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Optional. Only set these if you are not using Gmail; the script
          # defaults to smtp.gmail.com on port 587.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SITE_URL: https://pepelespokane.github.io/p4-survivor/
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_WEEK: ${{ inputs.test_week }}
          ONLY: ${{ inputs.only }}
          # The :20 cron carries the commissioner digests; every other trigger nags players.
          MODE: ${{ inputs.mode || (github.event.schedule == '20 * * * 4,5,6' && 'digest' || '') }}
          DIGEST_TO: ${{ secrets.SMTP_USER }}
        run: python send_reminders.py
