name: probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which ESPN hosts answer from a runner
        run: |
          UA='Mozilla/5.0'
          try () { printf '%-22s %s -> %s\n' "$1" "$3" "$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -H 'Accept: application/json' "$2")"; }
          try site.api "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=2026&seasontype=2&week=3&groups=80&limit=400" scoreboard
          try cdn.espn "https://cdn.espn.com/core/college-football/schedule?xhr=1&year=2026&week=3" schedule
          try sports.core "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/weeks/3/events?limit=200" events
          try sports.core.teams "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/groups/1/teams?limit=50" teams
          try site.web.api "https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/standings?season=2026" standings
          echo "--- cdn.espn body sample ---"
          curl -s -A "$UA" "https://cdn.espn.com/core/college-football/schedule?xhr=1&year=2026&week=3" | head -c 400
